name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: connecthub
          POSTGRES_PASSWORD: connecthub_ci
          POSTGRES_DB: connecthub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U connecthub" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://connecthub:connecthub_ci@localhost:5432/connecthub_test
      REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests && ruff format --check app tests
      - name: Type check
        run: mypy app
      - name: Migrations are in sync with models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic upgrade head && alembic check
      - name: Tests (unit + integration with PostgreSQL and Redis)
        run: pytest --cov=app --cov-report=term-missing

  simulator:
    name: Failure simulator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulator/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest

  frontend:
    name: Frontend (format, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build

  e2e:
    name: End-to-end (Docker Compose + resilience scenario)
    runs-on: ubuntu-latest
    needs: [backend, simulator, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/e2e/requirements.txt
      - name: Resilience scenario (500 -> retries -> replay -> success -> duplicate)
        env:
          NO_COLOR: "1"
        run: python tests/e2e/demo_scenario.py
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
