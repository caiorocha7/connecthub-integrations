[project]
name = "connecthub-backend"
version = "1.0.0"
description = "ConnectHub — API, worker e serviços de integração"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "B008",   # FastAPI Depends/Query in defaults
  "S101",   # asserts used for invariants / tests
  "RUF001", "RUF002", "RUF003", # Portuguese text with accents/ellipsis
  "UP046", "UP047", # keep typing.Generic/TypeVar style (Pydantic generics)
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311", "S108"]
"app/schemas/**" = ["S105", "RUF012"]
"app/core/config.py" = ["S105"]
"app/api/routes/auth.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.worker.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "broker: requires a running Redis broker (queue publish/consume test)",
]
filterwarnings = ["ignore::DeprecationWarning:celery.*", "ignore::DeprecationWarning:kombu.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/worker/celery_app.py"]
